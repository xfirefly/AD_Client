apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'


android {
    namespace 'com.bluberry.adclient'
    compileSdk rootProject.ext.compileSdkVersion
    resourcePrefix = "tvc_"

    defaultConfig {
        applicationId = "com.bluberry.adclient"

        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode version_code
        versionName version_name

    }

    signingConfigs {
        debug {
            keyAlias 'huiqiu'
            keyPassword '080710318'
            storeFile file('rk.keystore')
            storePassword '080710318'
        }
        release {
            keyAlias 'huiqiu'
            keyPassword '080710318'
            storeFile file('rk.keystore')
            storePassword '080710318'
        }

    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }

        debug {
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

dependencies {

    implementation "androidx.appcompat:appcompat:$rootProject.ext.supportLibraryVersion"
    implementation "androidx.constraintlayout:constraintlayout:$constraintlayout_version"
    implementation 'com.squareup.okhttp3:okhttp:' + okhttpVersion
    implementation 'io.github.azhon:appupdate:4.3.6'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'joda-time:joda-time:2.14.2'

}
